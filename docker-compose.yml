services:
  backend:
    build:
      context: ./backend
    container_name: expense-tracker-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      CHROMA_URL: http://chroma:8000
    volumes:
      - ./backend/expenses.db:/app/expenses.db
    depends_on:
      - chroma
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: expense-tracker-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: expense-tracker-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data
    restart: unless-stopped

volumes:
  chroma-data: